<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>流星雨星光禮物</title>
<style type="text/css">
*{
    box-sizing: border-box;
}

body{
    background-color: black;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body,html{
    width:100%;
    height:100%;
}

/* 開場圖片層 */
#openingScreen{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease-in-out;
    cursor: pointer;
}

#openingScreen.show{
    opacity: 1;
    pointer-events: auto;
}

#openingScreen.hide{
    opacity: 0;
    pointer-events: none;
}

#openingImage{
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* 流星雨畫布 */
canvas#stars{
    position: fixed;
    top:0;
    left:0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    z-index:1;
    display: block;
}

/* 15個更尖銳的黃色四芒星，無閃爍、固定亮度，可點擊 */
.float-point {
  position: fixed;
  z-index: 3;
  pointer-events: auto;
  width: 32px;
  height: 32px;
  background: transparent;
  cursor: pointer;
}

/* 四芒星本體 */
.float-point::before,
.float-point::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 3px;
  height: 30px;
  background: #ffe066;
  box-shadow:
    0 0 10px #ffd700,
    0 0 22px #ffae00,
    0 0 40px #ff8c00;
  transition: all 0.25s ease;
  transform-origin: center center;
}

.float-point::before {
  transform: translate(-50%, -50%) rotate(0deg);
}

.float-point::after {
  transform: translate(-50%, -50%) rotate(90deg);
}

/* 點擊啟動高亮狀態 */
.float-point.active::before,
.float-point.active::after{
  background: #ffffff;
  box-shadow:
    0 0 18px #fff,
    0 0 40px #ffd700,
    0 0 70px #ffb000;
}

/* 數字標籤 */
.star-label{
  position:absolute;
  top:48px;
  color:#ffe066;
  font-size:12px;
  letter-spacing:1px;
  text-shadow: 0 0 6px #ffb700;
  pointer-events:none;
  transition: all 0.25s ease;
}

.float-point.active .star-label{
  color:#ffffff;
  text-shadow: 0 0 8px #fff;
}

/* 背景音樂按鈕 */
#bgPlayerBtn {
  position: fixed;
  bottom:12px;
  left:12px;
  z-index: 10;
  padding: 6px 12px;
  font-size:14px;
  border:none;
  border-radius:6px;
  background:rgba(255,215,0,0.85);
  color:#000;
  cursor:pointer;
}
</style>

<script>
var context;
var canvas;
var arr = new Array();
var rains = new Array();
var starCount = 800;
var rainCount = 20;
var windowWidth = window.innerWidth;
var windowHeight = window.innerHeight;

let lastPlayingAudio = null;
const BG_VOLUME_NORMAL = 0.4;
const BG_VOLUME_LOW = 0.08;
const FADE_STEP = 0.02;
let bgAudio;
let bgFadeTimer = null;

// ========== 全部檔案放在根目錄 ==========
const bgAudioSrc = "bg.mp3";
const starAudioList = [
  "2566e1.mp3",
  "audio.mp3",
  "r1.mp3",
  "r2.mp3",
  "s1.mp3",
  "s2.mp3",
  "t1.mp3",
  "t2.mp3",
  "u1.mp3",
  "u2.mp3",
  "v1.mp3",
  "v2.mp3",
  "wpc35926.mp3",
  "t11.mp3",
  "t22.mp3"
];
const starAudios = [];
for(let i=0; i<15; i++){
  const audio = new Audio();
  audio.loop = false;
  starAudios.push(audio);
}

function fadeBgVolume(targetVol){
  clearInterval(bgFadeTimer);
  bgFadeTimer = setInterval(()=>{
    if(Math.abs(bgAudio.volume - targetVol) < FADE_STEP){
      bgAudio.volume = targetVol;
      clearInterval(bgFadeTimer);
      return;
    }
    bgAudio.volume += (bgAudio.volume > targetVol ? -FADE_STEP : FADE_STEP);
  }, 50);
}

function onStarAudioEnd(){
  lastPlayingAudio = null;
  fadeBgVolume(BG_VOLUME_NORMAL);
}

function toggleBgMusic(){
  if(bgAudio.paused){
    bgAudio.play().catch(e=>console.log(e));
  }else{
    bgAudio.pause();
  }
  updateBgBtnText();
}

function updateBgBtnText(){
  const btn = document.getElementById("bgPlayerBtn");
  if(!btn) return;
  btn.innerText = bgAudio.paused ? "背景音樂 ▶" : "背景音樂 ⏸";
}

function init(){
    canvas = document.getElementById("stars");
    context = canvas.getContext("2d");
    resizeCanvas();
    bgAudio = new Audio(bgAudioSrc);
    bgAudio.loop = true;
    bgAudio.volume = BG_VOLUME_NORMAL;
}

function resizeCanvas() {
    windowWidth = window.innerWidth;
    windowHeight = window.innerHeight;

    // 關鍵：每次 resize 都重新設定畫布邏輯尺寸與顯示尺寸
    canvas.width = windowWidth;
    canvas.height = windowHeight;
    canvas.style.width = windowWidth + "px";
    canvas.style.height = windowHeight + "px";

    resetMeteors();
}

function resetMeteors() {
    for (var i = 0; i < rains.length; i++) {
        var rain = rains[i];
        rain.x = Math.random() * windowWidth;
        rain.y = Math.random() * windowHeight * 0.4;
    }
}

window.addEventListener("resize", resizeCanvas);

var Star = function (){
    this.x = windowWidth * Math.random();
    this.y = 5000 * Math.random();
    this.text=".";
    this.color = "white";

    this.getColor=function(){
        var _r = Math.random();
        if(_r<0.5){
            this.color = "#333";
        }else{
            this.color = "white";
        }
    }

    this.init=function(){
        this.getColor();
    }

    this.draw=function(){
        context.fillStyle=this.color;
        context.fillText(this.text, this.x, this.y);
    }
}

window.onload = function() {
    init();

    for (var i=0;i<starCount;i++) {
        var star = new Star();
        star.init();
        star.draw();
        arr.push(star);
    }

    for (var i=0;i<rainCount;i++) {
        var rain = new MeteorRain();
        rain.init();
        rain.draw();
        rains.push(rain);
    }

    playStars();
    playRains();
    startFloatingPoints(15);
    updateBgBtnText();

    // 開場圖片漸入漸出
    startOpeningSequence();
}

function playStars(){
    for (var n = 0; n < starCount; n++){
        arr[n].getColor();
        arr[n].draw();
    }
    setTimeout("playStars()",100);
}

var MeteorRain = function(){
    this.x = -1;
    this.y = -1;
    this.length = -1;
    this.angle = 30;
    this.width = -1;
    this.height = -1;
    this.speed = 1;
    this.offset_x = -1;
    this.offset_y = -1;
    this.alpha = 1;
    this.color1 = "";
    this.color2 = "";

    this.init = function (){
        this.getPos();
        this.alpha = 1;
        this.getRandomColor();
        var x = Math.random() * 80 + 150;
        this.length = Math.ceil(x);
        this.angle = 30;
        x = Math.random() + 0.5;
        this.speed = Math.ceil(x);
        var cos = Math.cos(this.angle * 3.14 / 180);
        var sin = Math.sin(this.angle * 3.14 / 180);
        this.width = this.length * cos;
        this.height = this.length * sin;
        this.offset_x = this.speed * cos;
        this.offset_y = this.speed * sin;
    }

    this.getRandomColor = function (){
        var a = Math.ceil(255 - 240 * Math.random());
        this.color1 = "rgba("+a+","+a+","+a+",1)";
        this.color2 = "black";
    }

    this.countPos = function (){
        this.x = this.x - this.offset_x;
        this.y = this.y + this.offset_y;
    }

    this.getPos = function (){
        this.x = Math.random() * windowWidth;
        this.y = Math.random() * windowHeight * 0.4;
    }

    this.draw = function (){
        context.save();
        context.beginPath();
        context.lineWidth = 1;
        context.globalAlpha = this.alpha;
        var line = context.createLinearGradient(
            this.x, this.y,
            this.x + this.width,
            this.x - this.height
        );
        line.addColorStop(0, "white");
        line.addColorStop(0.3, this.color1);
        line.addColorStop(0.6, this.color2);
        context.strokeStyle = line;
        context.moveTo(this.x, this.y);
        context.lineTo(this.x + this.width, this.y - this.height);
        context.closePath();
        context.stroke();
        context.restore();
    }

    this.move = function(){
        var x = this.x + this.width - this.offset_x;
        var y = this.y - this.height;
        context.clearRect(x - 3, y - 3, this.offset_x + 5, this.offset_y + 5);
        this.countPos();
        this.alpha -= 0.002;
        this.draw();
    }
}

function playRains(){
    for (var n = 0; n < rainCount; n++){
        var rain = rains[n];
        rain.move();
        if (rain.y > windowHeight || rain.x < -rain.width) {
            context.clearRect(rain.x, rain.y - rain.height, rain.width, rain.height);
            rains[n] = new MeteorRain();
            rains[n].init();
        }
    }
    setTimeout("playRains()",2);
}

function startFloatingPoints(total = 15) {
  for (let i = 0; i < total; i++) {
    const dot = document.createElement('div');
    dot.className = 'float-point';
    dot.dataset.starIndex = i;

    const label = document.createElement('span');
    label.className = "star-label";
    label.innerText = i;
    dot.appendChild(label);

    dot.style.left = Math.random() * 100 + 'vw';
    dot.style.top = Math.random() * 100 + 'vh';
    document.body.appendChild(dot);

    const audioSrc = starAudioList[i];
    const audio = starAudios[i];
    audio.src = audioSrc;
    audio.onended = onStarAudioEnd;

    dot.addEventListener('click', function(){
      const idx = Number(this.dataset.starIndex);
      const src = starAudioList[idx];
      if(!src) return;
      const audio = starAudios[idx];

      if(!audio.paused){
        audio.pause();
        if(lastPlayingAudio === audio){
          lastPlayingAudio = null;
          fadeBgVolume(BG_VOLUME_NORMAL);
        }
        this.classList.remove('active');
        return;
      }

      document.querySelectorAll('.float-point').forEach(el=>el.classList.remove('active'));
      this.classList.add('active');

      if(lastPlayingAudio && lastPlayingAudio !== audio){
        lastPlayingAudio.pause();
      }
      lastPlayingAudio = audio;

      fadeBgVolume(BG_VOLUME_LOW);
      audio.play().catch(e=>console.log(e));
    })

    let x = parseFloat(dot.style.left);
    let y = parseFloat(dot.style.top);
    let vx = (Math.random() - 0.5) * 0.035;
    let vy = (Math.random() - 0.5) * 0.035;

    function move() {
      x += vx;
      y += vy;
      if (x < 0 || x > 100) vx = -vx;
      if (y < 0 || y > 100) vy = -vy;
      x = Math.max(0, Math.min(100, x));
      y = Math.max(0, Math.min(100, y));
      dot.style.left = x + 'vw';
      dot.style.top = y + 'vh';
      requestAnimationFrame(move);
    }

    move();
  }
}

// 開場圖片漸入漸出控制
function startOpeningSequence(){
    const openingScreen = document.getElementById("openingScreen");
    const openingImage = document.getElementById("openingImage");

    // 點擊開場層，直接執行背景音樂切換（等同左下角按鈕）
    openingScreen.onclick = function(){
        toggleBgMusic();
    }

    // 設定開場圖片路徑
    openingImage.src = "opening.jpg";

    // 圖片載入後開始動畫
    openingImage.onload = function(){
        openingScreen.classList.add("show");

        // 漸入完成後停留 2 秒，再漸出
        setTimeout(function(){
            openingScreen.classList.add("hide");

            // 漸出完成後移除開場層
            setTimeout(function(){
                openingScreen.style.display = "none";
            }, 1200);
        }, 2000);
    };

    // 如果圖片快取已存在，手動觸發
    if(openingImage.complete){
        openingImage.onload();
    }
}
</script>
</head>

<body>

<!-- 開場圖片層 -->
<div id="openingScreen">
  <img id="openingImage" alt="opening">
</div>

<!-- 原本流星雨與四芒星主頁面 -->
<canvas id="stars"></canvas>
<button id="bgPlayerBtn" onclick="toggleBgMusic()">背景音樂 ▶</button>

</body>
</html>
